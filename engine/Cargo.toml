[package]
name = "gust-engine"
version = "0.9.10"
edition = "2021"
license = "MIT"
description = "Packet-level DPI desync engine for Gust (WinDivert)"

[dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
hkdf = "0.12"
sha2 = "0.10"
ctr = "0.9"
getrandom = "0.3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "net", "io-util", "io-std", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }

[[bin]]
name = "gust-engine"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
