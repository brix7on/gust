name: release

on:
  push:
    tags: ["v*"]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
            window/target
            app/target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Toolchain for Windows
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q gcc-mingw-w64-x86-64
          rustup target add x86_64-pc-windows-gnu

      - name: Version
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "GUST_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
          esac

      - name: Build and test
        run: sh build.sh

      - name: Package
        run: |
          v="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF" in refs/tags/*) ;; *) v="dev-${GITHUB_SHA::7}" ;; esac
          cd dist
          zip -9 "../Gust-$v-windows-x64.zip" Gust.exe
          zip -9 "../gust-engine-$v-windows-x64.zip" gust-engine.exe
          cd .. && cp dist/Gust.exe Gust.exe && sha256sum *.zip Gust.exe > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: "*.zip"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./*.zip Gust.exe SHA256SUMS \
            --title "Gust ${GITHUB_REF_NAME#v}" \
            --notes "Скачайте \`Gust.exe\` и запустите (или \`Gust-…-windows-x64.zip\`, если exe блокирует браузер). Собственный движок уже встроен в Gust.exe (Настройки → Движок обхода); отдельный \`gust-engine\` — для запуска вручную.
          Download and run \`Gust.exe\` (or \`Gust-…-windows-x64.zip\` if the browser blocks the exe). The own engine is built into Gust.exe (Settings → Bypass engine); the separate \`gust-engine\` is for manual use." \
            --generate-notes
